<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unity Test</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    #unity-container { width: 960px; height: 600px; margin: auto; position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script>
    var buildUrl = "https://xqdoichemmpgqcdfixqn.supabase.co/storage/v1/object/public/games/d5141b37-2e6c-4acf-90ba-4b825c8b3052/Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build.data",
      frameworkUrl: buildUrl + "/Build.framework.js",
      codeUrl: buildUrl + "/Build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourGame",
      productVersion: "1.0"
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
        console.log("Loading Progress:", progress);
      }).then((unityInstance) => {
        console.log("✅ Unity loaded!", unityInstance);
      }).catch((message) => {
        alert("❌ Error loading Unity: " + message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
